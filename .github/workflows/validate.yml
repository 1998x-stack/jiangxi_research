name: Research data reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: python -m compileall -q scripts
      - name: Rebuild data and analytics without optional third-party packages
        run: |
          python -S scripts/prepare_data.py
          python -S scripts/reproduce.py
          python -S scripts/test_research.py
      - name: Verify stable scientific records (ignore BOM and line-ending normalization)
        run: python scripts/verify_tracked_outputs.py
