name: Research data reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: python -m compileall -q scripts
      - name: Rebuild raw observations and descriptive results
        run: |
          python -S scripts/prepare_data.py
          python -S scripts/reproduce.py
          python -S scripts/test_research.py
      - name: Verify stable scientific records
        run: python scripts/verify_tracked_outputs.py
      - name: Recompute urban-rural estimates (18 Ganzhou counties)
        run: |
          python -S scripts/analyze_urban_rural.py
          python -S scripts/test_urban_rural.py
          python -S scripts/build_resident_policy_coverage.py
          python -S scripts/test_2025_county_fund_policy.py
          python -S scripts/test_archive_sources.py
      - name: Publish derived population tables
        uses: actions/upload-artifact@v4
        with:
          name: ganzhou-urban-rural-derived
          path: |
            outputs/ganzhou_urban_rural_derived.csv
            outputs/ganzhou_urban_rural_summary.json
            outputs/resident_policy_coverage_100_counties_2025.csv

  evidence-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline audit parser and workbook dependencies
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'openpyxl>=3.1,<4'
      - name: Verify archived source integrity and recompute audit
        run: |
          python scripts/audit_snapshots.py
          python scripts/review_semantic_evidence.py
          python scripts/test_semantic_evidence.py
          python scripts/build_audited_workbook.py
          python scripts/test_source_audit.py
      - name: Audit table is reproducible from committed snapshots
        run: git diff --exit-code -- outputs/source_number_audit.csv
      - name: Publish audit results
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence-audit
          path: |
            outputs/source_number_audit.csv
            outputs/semantic_evidence_audit.csv
            outputs/江西县域社会保障_2025可复现审计工作簿.xlsx
